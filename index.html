<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文單字 Master</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #eab308;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      width: 100%;
      max-width: 600px;
      padding: 15px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .stats-bar {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    main {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 600px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 10;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      gap: 4px;
    }

    .nav-btn.active {
      color: var(--accent-color);
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }

    .flashcard {
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }

    .star-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-sub);
      cursor: pointer;
    }

    .star-btn.starred {
      color: var(--accent-yellow);
    }

    .level-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #334155;
      color: var(--accent-color);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .word-title {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .word-other-forms {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .word-furigana {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .word-pos {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    .word-meaning {
      font-size: 1.3rem;
      margin-top: 10px;
    }

    .example-box {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      text-align: left;
    }

    .example-ja {
      font-size: 1.05rem;
      color: #f1f5f9;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .example-en {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .audio-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      margin-left: 8px;
      vertical-align: middle;
      font-size: 1rem;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
      width: 100%;
    }

    .option-btn {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 15px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent-color);
    }

    .option-btn.correct {
      background-color: rgba(34, 197, 94, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .option-btn.wrong {
      background-color: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .match-card {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .match-card.selected {
      border-color: var(--accent-color);
      background-color: rgba(56, 189, 248, 0.1);
    }

    .match-card.matched {
      visibility: hidden;
    }

    .btn {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 5px;
    }

    .checkbox-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .checkbox-label {
      font-size: 0.88rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .wrong-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .star-tag {
      color: var(--accent-yellow);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>日文單字 Master</h1>
    <div class="stats-bar" id="globalStats">已學: 0 / 總計: 0</div>
  </header>

  <main>
    <!-- 1. 每日任務 -->
    <section id="dailySec">
      <div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h3>📅 每日學習與複習 (目標: 30字)</h3>
          <span id="dailyProgress" style="font-size: 0.85rem; color: var(--text-sub);">進度: 0 / 30</span>
        </div>
        
        <div class="checkbox-group">
          <span style="font-size:0.8rem; color:var(--text-sub); width:100%;">選擇練習等級：</span>
          <label class="checkbox-label"><input type="checkbox" value="N5" class="jlpt-check" checked onchange="resetDailyTask()"> N5</label>
          <label class="checkbox-label"><input type="checkbox" value="N4" class="jlpt-check" checked onchange="resetDailyTask()"> N4</label>
          <label class="checkbox-label"><input type="checkbox" value="N3" class="jlpt-check" checked onchange="resetDailyTask()"> N3</label>
          <label class="checkbox-label"><input type="checkbox" value="N2" class="jlpt-check" checked onchange="resetDailyTask()"> N2</label>
        </div>
      </div>
      <div id="dailyContainer"></div>
    </section>

    <!-- 2. 單字卡瀏覽 -->
    <section id="cardSec" class="hidden">
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <select id="jlptFilter" onchange="filterWords()" style="background:#1e293b; color:#fff; padding:8px; border-radius:6px; border:1px solid #334155; flex:1;">
          <option value="ALL">全部 JLPT</option>
          <option value="N5">N5</option>
          <option value="N4">N4</option>
          <option value="N3">N3</option>
          <option value="N2">N2</option>
        </select>
      </div>
      <div class="card flashcard" id="flashcard" onclick="flipCard()"></div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="prevCard()">上一張</button>
        <button class="btn" onclick="nextCard()">下一張</button>
      </div>
    </section>

    <!-- 3. 錯誤列表與星級複習 -->
    <section id="wrongSec" class="hidden">
      <h3>❌ 錯題本與星級複習</h3>
      <p style="font-size:0.85rem; color:var(--text-sub); margin-top:4px; margin-bottom:12px;">
        根據答錯次數分級：⭐(1-2次) | ⭐⭐(3-4次) | ⭐⭐⭐(5次以上)
      </p>

      <div class="checkbox-group">
        <span style="font-size:0.8rem; color:var(--text-sub); width:100%;">篩選複習星級：</span>
        <label class="checkbox-label"><input type="checkbox" value="1" class="star-check" checked onchange="renderWrongList()"> ⭐ 輕微錯誤</label>
        <label class="checkbox-label"><input type="checkbox" value="2" class="star-check" checked onchange="renderWrongList()"> ⭐⭐ 中度錯誤</label>
        <label class="checkbox-label"><input type="checkbox" value="3" class="star-check" checked onchange="renderWrongList()"> ⭐⭐⭐ 重度錯題</label>
      </div>

      <div style="margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
        <span id="wrongCountText" style="font-size:0.9rem; color:var(--text-sub);">符合條件錯題：0 字</span>
        <button class="btn" onclick="startWrongPractice()">開始練習篩選錯題</button>
      </div>

      <div id="wrongPracticeArea" class="card hidden" style="margin-bottom:15px;"></div>
      <div id="wrongListContainer"></div>
    </section>

    <!-- 4. 配對遊戲 -->
    <section id="matchSec" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>🎮 配對連連看</h3>
        <button class="btn" onclick="startMatchGame()">重新開始</button>
      </div>
      <div class="match-grid" id="matchGrid"></div>
    </section>

    <!-- 5. 設定 -->
    <section id="settingSec" class="hidden">
      <h3>⚙️ 設定與同步</h3>
      <div class="card" style="margin-top:10px;">
        <p style="font-size:0.88rem; color:var(--text-sub); margin-bottom:15px; line-height:1.6;">
          自動讀取目錄：<br>
          <code style="color:var(--accent-color);">/csv/vocab-n5.csv</code><br>
          <code style="color:var(--accent-color);">/csv/vocab-n4.csv</code><br>
          <code style="color:var(--accent-color);">/csv/vocab-n3.csv</code><br>
          <code style="color:var(--accent-color);">/csv/vocab-n2.csv</code>
        </p>
        <button class="btn" onclick="loadAllCSVsFromFolder()">🔄 重新整理並更新單字庫</button>
      </div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('dailySec', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
      每日任務
    </button>
    <button class="nav-btn" onclick="switchTab('cardSec', this)">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      單字卡
    </button>
    <button class="nav-btn" onclick="switchTab('wrongSec', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
      錯誤列表
    </button>
    <button class="nav-btn" onclick="switchTab('matchSec', this)">
      <svg viewBox="0 0 24 24"><path d="M21.58 16.09l-1.09-7.66c-.25-1.72-1.71-3.01-3.45-3.01h-2.04V3.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5V5.42H9.96c-1.74 0-3.2 1.29-3.45 3.01l-1.09 7.66C5.07 18.5 6.94 20 9.35 20h5.3c2.41 0 4.28-1.5 3.93-3.91z"/></svg>
      配對遊戲
    </button>
    <button class="nav-btn" onclick="switchTab('settingSec', this)">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c-.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      設定
    </button>
  </nav>

  <script>
    const SRS_INTERVALS = [0, 1, 2, 4, 7, 15];

    let words = JSON.parse(localStorage.getItem("jp_words")) || [];
    let filteredWords = [...words];
    let cardIndex = 0;
    let isFlipped = false;

    function init() {
      loadAllCSVsFromFolder();
    }

    function saveWords() {
      localStorage.setItem("jp_words", JSON.stringify(words));
      updateGlobalStats();
    }

    function updateGlobalStats() {
      const learned = words.filter(w => w.srs_stage > 0).length;
      document.getElementById("globalStats").innerText = `已學: ${learned} / 總計: ${words.length}`;
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll("main > section").forEach(sec => sec.classList.add("hidden"));
      document.getElementById(tabId).classList.remove("hidden");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      if (tabId === "matchSec") startMatchGame();
      if (tabId === "wrongSec") renderWrongList();
      if (tabId === "dailySec") renderDailyTask();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 防止語音堆疊
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ja-JP';
        window.speechSynthesis.speak(utter);
      }
    }

    function loadAllCSVsFromFolder() {
      const csvFiles = [
        { path: './csv/vocab-n5.csv', defaultLevel: 'N5' },
        { path: './csv/vocab-n4.csv', defaultLevel: 'N4' },
        { path: './csv/vocab-n3.csv', defaultLevel: 'N3' },
        { path: './csv/vocab-n2.csv', defaultLevel: 'N2' }
      ];

      let loadedCount = 0;
      let allParsedWords = [];

      csvFiles.forEach(fileObj => {
        fetch(fileObj.path)
          .then(res => {
            if (!res.ok) throw new Error(`讀取 ${fileObj.path} 失敗`);
            return res.text();
          })
          .then(text => {
            const parsed = parseCSVText(text, fileObj.defaultLevel);
            allParsedWords = allParsedWords.concat(parsed);
          })
          .catch(err => console.warn(err.message))
          .finally(() => {
            loadedCount++;
            if (loadedCount === csvFiles.length) {
              if (allParsedWords.length > 0) mergeWords(allParsedWords);
              updateGlobalStats();
              resetDailyTask();
              filterWords();
            }
          });
      });
    }

    function parseCSVLine(text) {
      let result = [], field = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(field.trim()); field = ''; }
        else field += c;
      }
      result.push(field.trim());
      return result.map(f => f.replace(/^\ufeff/, '').replace(/^"|"$/g, '').trim());
    }

    function parseCSVText(text, defaultLevel) {
      const lines = text.split(/\r\n|\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length < 1) return [];

      const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());
      const findCol = (keywords) => {
        for (let kw of keywords) {
          let idx = headers.findIndex(h => h.includes(kw));
          if (idx !== -1) return idx;
        }
        return -1;
      };

      let wordIdx = findCol(['word', '單字']);
      let readingIdx = findCol(['reading', '假名', '發音']);
      let meaningIdx = findCol(['meaning', '意思', '中文', 'meanings']);
      let levelIdx = findCol(['level', 'n級', 'jlpt']);
      let posIdx = findCol(['pos', '詞性']);
      let otherIdx = findCol(['other_forms', 'other', '其他']);
      let exJaIdx = findCol(['example_ja', '例句', '日文例句']);
      let exEnIdx = findCol(['example_en', '英文', '翻譯']);

      let startIndex = 1;
      if (wordIdx === -1 && meaningIdx === -1) {
        startIndex = 0;
        wordIdx = 0; readingIdx = 1; meaningIdx = 2; levelIdx = 3; posIdx = 4; otherIdx = 5; exJaIdx = 6; exEnIdx = 7;
      }

      let parsedList = [];
      for (let i = startIndex; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        const wVal = wordIdx !== -1 ? cols[wordIdx] : cols[0];
        const mVal = meaningIdx !== -1 ? cols[meaningIdx] : cols[2];

        if (wVal) {
          parsedList.push({
            word: wVal || '',
            reading: readingIdx !== -1 && cols[readingIdx] !== undefined ? cols[readingIdx] : (cols[1] || ''),
            meaning: mVal || '',
            level: levelIdx !== -1 && cols[levelIdx] ? cols[levelIdx].toUpperCase() : defaultLevel,
            pos: posIdx !== -1 && cols[posIdx] !== undefined ? cols[posIdx] : (cols[4] || ''),
            other_forms: otherIdx !== -1 && cols[otherIdx] !== undefined ? cols[otherIdx] : (cols[5] || ''),
            example_ja: exJaIdx !== -1 && cols[exJaIdx] !== undefined ? cols[exJaIdx] : (cols[6] || ''),
            example_en: exEnIdx !== -1 && cols[exEnIdx] !== undefined ? cols[exEnIdx] : (cols[7] || '')
          });
        }
      }
      return parsedList;
    }

    function mergeWords(newParsedWords) {
      const oldMap = new Map(words.map(w => [w.word, w]));
      words = newParsedWords.map(nw => {
        const old = oldMap.get(nw.word) || {};
        return {
          ...nw,
          srs_stage: old.srs_stage || 0,
          next_review_date: old.next_review_date || 0,
          wrong_count: old.wrong_count || 0,
          starred: old.starred || false
        };
      });
      saveWords();
    }

    /* ---------------- 1. 每日任務 (多選 JLPT + 間隔重複演算法) ---------------- */
    let dailyList = [];
    let dailyIndex = 0;

    function getSelectedJLPT() {
      const checkboxes = document.querySelectorAll('.jlpt-check:checked');
      return Array.from(checkboxes).map(cb => cb.value);
    }

    function resetDailyTask() {
      dailyList = [];
      dailyIndex = 0;
      renderDailyTask();
    }

    function isDueForReview(word, nowTime) {
      if (word.srs_stage === 0) return false;
      return word.next_review_date <= nowTime;
    }

    function renderDailyTask() {
      const container = document.getElementById("dailyContainer");
      if (words.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center;">載入單字庫中...</div>`;
        return;
      }

      const selectedLevels = getSelectedJLPT();
      if (selectedLevels.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--accent-red);">請至少勾選一個 JLPT 等級進行練習！</div>`;
        return;
      }

      const pool = words.filter(w => selectedLevels.includes(w.level));

      if (dailyList.length === 0) {
        const now = Date.now();
        const dueWords = pool.filter(w => isDueForReview(w, now)).sort((a,b) => a.next_review_date - b.next_review_date);
        const newWords = pool.filter(w => w.srs_stage === 0);
        dailyList = [...dueWords, ...newWords].slice(0, 30);
      }

      document.getElementById("dailyProgress").innerText = `進度: ${Math.min(dailyIndex, dailyList.length)} / ${dailyList.length}`;

      if (dailyIndex >= dailyList.length || dailyList.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding: 40px 20px;">
            <h2>🎉 今天目標已完成！</h2>
            <p style="color:var(--text-sub); margin-top:10px;">已完成今日所選等級 (${selectedLevels.join(', ')}) 的學習與複習。</p>
            <button class="btn" style="margin-top:20px;" onclick="resetDailyTask();">再學一輪</button>
          </div>
        `;
        return;
      }

      const currWord = dailyList[dailyIndex];

      if (currWord.srs_stage === 0) {
        const wrongMeanings = words.filter(w => w.word !== currWord.word).map(w => w.meaning).filter(Boolean).sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [currWord.meaning, ...wrongMeanings].sort(() => 0.5 - Math.random());

        container.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
              <span class="tag" style="background:rgba(34, 197, 94, 0.2); color:var(--accent-green);">✨ 新單字</span>
              <span style="font-size:0.85rem; color:var(--text-sub);">${currWord.level} 單字</span>
            </div>
            <div>
              <div class="word-title">${currWord.word} <span class="word-furigana">（${currWord.reading || ''}）</span> <button class="audio-btn" onclick="speak('${currWord.word}')">🔊</button></div>
              ${currWord.other_forms ? `<div class="word-other-forms">(${currWord.other_forms})</div>` : ''}
              <div class="word-pos">${currWord.pos || ''}</div>
            </div>
            <div class="example-box">
              <div style="font-weight:bold; font-size:0.85rem; color:var(--accent-color); margin-bottom:4px; display:flex; align-items:center; justify-content:space-between;">
                <span>情境例句：</span>
                ${currWord.example_ja ? `<button class="audio-btn" onclick="speak('${currWord.example_ja}')" style="font-size:0.9rem;">🔊 讀例句</button>` : ''}
              </div>
              <div class="example-ja">${currWord.example_ja || '無例句'}</div>
              ${currWord.example_en ? `<div class="example-en">${currWord.example_en}</div>` : ''}
            </div>
            <div style="font-weight:bold; margin-top:18px; margin-bottom:10px; font-size:0.95rem;">這句話最接近哪個意思？</div>
            <div class="quiz-options">
              ${options.map(opt => `<button class="option-btn" onclick="checkDailyAnswer(this, '${opt}', '${currWord.meaning}')">${opt}</button>`).join('')}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="card flashcard" onclick="this.querySelector('.word-meaning').classList.toggle('hidden')">
            <span class="tag" style="position:absolute; top:15px; left:15px;">🔄 階段 ${currWord.srs_stage} 複習 (${currWord.level})</span>
            <div class="word-title">${currWord.word}</div>
            ${currWord.other_forms ? `<div class="word-other-forms">(${currWord.other_forms})</div>` : ''}
            <div class="word-furigana">${currWord.reading || ''} <button class="audio-btn" onclick="event.stopPropagation(); speak('${currWord.word}')">🔊</button></div>
            <div class="word-meaning hidden" style="color:var(--accent-green); font-weight:bold; margin-top:15px;">
              ${currWord.meaning}
              <div class="example-box">
                <div style="display:flex; align-items:center; justify-content:flex-end;">
                  ${currWord.example_ja ? `<button class="audio-btn" onclick="event.stopPropagation(); speak('${currWord.example_ja}')" style="font-size:0.9rem;">🔊 讀例句</button>` : ''}
                </div>
                <div class="example-ja">${currWord.example_ja || ''}</div>
                <div class="example-en">${currWord.example_en || ''}</div>
              </div>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn btn-secondary" onclick="markSRS(false)">不熟悉 (降回階段1)</button>
            <button class="btn" onclick="markSRS(true)">記住了 (晉級下一階段)</button>
          </div>
        `;
      }
    }

    function checkDailyAnswer(btn, selected, correct) {
      const options = btn.parentElement.querySelectorAll('.option-btn');
      options.forEach(b => b.disabled = true);
      const currWord = dailyList[dailyIndex];

      if (selected === correct) {
        btn.classList.add('correct');
        updateWordSRS(currWord, true);
        setTimeout(() => { dailyIndex++; renderDailyTask(); }, 1200);
      } else {
        btn.classList.add('wrong');
        options.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
        currWord.wrong_count = (currWord.wrong_count || 0) + 1;
        updateWordSRS(currWord, false);
        setTimeout(() => { dailyIndex++; renderDailyTask(); }, 2000);
      }
    }

    function markSRS(success) {
      const currWord = dailyList[dailyIndex];
      if (!success) {
        currWord.wrong_count = (currWord.wrong_count || 0) + 1;
      }
      updateWordSRS(currWord, success);
      dailyIndex++;
      renderDailyTask();
    }

    function updateWordSRS(word, success) {
      if (success) {
        word.srs_stage = Math.min(SRS_INTERVALS.length - 1, (word.srs_stage || 0) + 1);
      } else {
        word.srs_stage = 1;
      }
      const daysToAdd = SRS_INTERVALS[word.srs_stage];
      word.next_review_date = Date.now() + (daysToAdd * 24 * 60 * 60 * 1000);
      saveWords();
    }

    /* ---------------- 2. 錯誤列表與星級練習 ---------------- */
    function getStarRating(count) {
      if (count >= 5) return 3;
      if (count >= 3) return 2;
      if (count >= 1) return 1;
      return 0;
    }

    function getSelectedStars() {
      const checkboxes = document.querySelectorAll('.star-check:checked');
      return Array.from(checkboxes).map(cb => parseInt(cb.value));
    }

    function renderWrongList() {
      const container = document.getElementById("wrongListContainer");
      const selectedStars = getSelectedStars();

      const wrongWords = words.filter(w => (w.wrong_count || 0) > 0)
                              .sort((a,b) => b.wrong_count - a.wrong_count);

      const filteredWrong = wrongWords.filter(w => selectedStars.includes(getStarRating(w.wrong_count)));

      document.getElementById("wrongCountText").innerText = `符合條件錯題：${filteredWrong.length} 字`;

      if (filteredWrong.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--text-sub);">太棒了！目前沒有符合篩選條件的錯誤單字。</div>`;
        return;
      }

      container.innerHTML = filteredWrong.map(w => {
        const starNum = getStarRating(w.wrong_count);
        const starsText = "⭐".repeat(starNum);
        return `
          <div class="wrong-list-item">
            <div>
              <div style="font-size:1.1rem; font-weight:bold;">${w.word} <span style="font-size:0.85rem; color:var(--accent-color);">(${w.reading})</span> <button class="audio-btn" onclick="speak('${w.word}')">🔊</button></div>
              <div style="font-size:0.9rem; color:var(--text-sub);">${w.meaning}</div>
            </div>
            <div style="text-align:right;">
              <div class="star-tag">${starsText}</div>
              <div style="font-size:0.75rem; color:var(--text-sub);">錯 ${w.wrong_count} 次</div>
            </div>
          </div>
        `;
      }).join('');
    }

    let wrongPracticeList = [];
    let wrongPracticeIdx = 0;

    function startWrongPractice() {
      const selectedStars = getSelectedStars();
      wrongPracticeList = words.filter(w => (w.wrong_count || 0) > 0 && selectedStars.includes(getStarRating(w.wrong_count)))
                               .sort(() => 0.5 - Math.random());

      wrongPracticeIdx = 0;
      const area = document.getElementById("wrongPracticeArea");

      if (wrongPracticeList.length === 0) {
        alert("目前沒有符合星級條件的錯題可供練習！");
        area.classList.add("hidden");
        return;
      }

      area.classList.remove("hidden");
      renderWrongPracticeCard();
    }

    function renderWrongPracticeCard() {
      const area = document.getElementById("wrongPracticeArea");
      if (wrongPracticeIdx >= wrongPracticeList.length) {
        area.innerHTML = `
          <div style="text-align:center;">
            <h3>🎉 錯題專項練習完成！</h3>
            <button class="btn" style="margin-top:10px;" onclick="document.getElementById('wrongPracticeArea').classList.add('hidden')">關閉練習</button>
          </div>
        `;
        renderWrongList();
        return;
      }

      const curr = wrongPracticeList[wrongPracticeIdx];
      const wrongMeanings = words.filter(w => w.word !== curr.word).map(w => w.meaning).filter(Boolean).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [curr.meaning, ...wrongMeanings].sort(() => 0.5 - Math.random());

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span class="tag" style="background:rgba(239, 68, 68, 0.2); color:var(--accent-red);">錯題強化 (${wrongPracticeIdx + 1}/${wrongPracticeList.length})</span>
          <span class="star-tag">${"⭐".repeat(getStarRating(curr.wrong_count))}</span>
        </div>
        <div style="font-size:1.6rem; font-weight:bold;">${curr.word} <span style="font-size:1rem; color:var(--accent-color);">(${curr.reading})</span> <button class="audio-btn" onclick="speak('${curr.word}')">🔊</button></div>
        
        <div class="example-box" style="margin-top:10px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <span style="font-size:0.85rem; color:var(--accent-color);">例句：</span>
            ${curr.example_ja ? `<button class="audio-btn" onclick="speak('${curr.example_ja}')" style="font-size:0.85rem;">🔊 讀例句</button>` : ''}
          </div>
          <div class="example-ja">${curr.example_ja || ''}</div>
          <div class="example-en">${curr.example_en || ''}</div>
        </div>

        <div class="quiz-options">
          ${options.map(opt => `<button class="option-btn" onclick="checkWrongPractice(this, '${opt}', '${curr.meaning}')">${opt}</button>`).join('')}
        </div>
      `;
    }

    function checkWrongPractice(btn, selected, correct) {
      const options = btn.parentElement.querySelectorAll('.option-btn');
      options.forEach(b => b.disabled = true);
      const curr = wrongPracticeList[wrongPracticeIdx];

      if (selected === correct) {
        btn.classList.add('correct');
        if (curr.wrong_count > 0) curr.wrong_count--;
        saveWords();
        setTimeout(() => { wrongPracticeIdx++; renderWrongPracticeCard(); }, 1200);
      } else {
        btn.classList.add('wrong');
        options.forEach(b => { if (b.innerText === correct) b.classList.add('correct'); });
        curr.wrong_count++;
        saveWords();
        setTimeout(() => { wrongPracticeIdx++; renderWrongPracticeCard(); }, 2000);
      }
    }

    /* ---------------- 3. 單字卡瀏覽 ---------------- */
    function renderFlashCard() {
      if (filteredWords.length === 0) {
        document.getElementById("flashcard").innerHTML = `<div>目前沒有符合條件的單字</div>`;
        return;
      }
      const item = filteredWords[cardIndex];
      const isStarred = item.starred ? 'starred' : '';

      document.getElementById("flashcard").innerHTML = `
        <span class="level-badge">${item.level || 'N5'} ${item.pos ? '| ' + item.pos : ''}</span>
        <button class="star-btn ${isStarred}" onclick="event.stopPropagation(); toggleStar('${item.word}')">★</button>
        <div class="word-title">${item.word}</div>
        ${item.other_forms ? `<div class="word-other-forms">(${item.other_forms})</div>` : ''}
        <div class="word-furigana">${item.reading || ''} <button class="audio-btn" onclick="event.stopPropagation(); speak('${item.word}')">🔊</button></div>
        <div id="cardBack" class="${isFlipped ? '' : 'hidden'}">
          <div class="word-meaning">${item.meaning}</div>
          <div class="example-box">
            <div style="display:flex; align-items:center; justify-content:flex-end;">
              ${item.example_ja ? `<button class="audio-btn" onclick="event.stopPropagation(); speak('${item.example_ja}')" style="font-size:0.85rem;">🔊 讀例句</button>` : ''}
            </div>
            <div class="example-ja">${item.example_ja || ''}</div>
            <div class="example-en">${item.example_en || ''}</div>
          </div>
        </div>
        <div style="font-size:0.75rem; color:var(--text-sub); margin-top:15px;">(點擊卡片翻面)</div>
      `;
    }

    function flipCard() { isFlipped = !isFlipped; renderFlashCard(); }
    function nextCard() { isFlipped = false; cardIndex = (cardIndex + 1) % filteredWords.length; renderFlashCard(); }
    function prevCard() { isFlipped = false; cardIndex = (cardIndex - 1 + filteredWords.length) % filteredWords.length; renderFlashCard(); }

    function toggleStar(wordText) {
      const target = words.find(w => w.word === wordText);
      if (target) {
        target.starred = !target.starred;
        saveWords();
        renderFlashCard();
      }
    }

    function filterWords() {
      const jlpt = document.getElementById("jlptFilter").value;
      filteredWords = words.filter(w => (jlpt === "ALL" || w.level === jlpt));
      cardIndex = 0;
      isFlipped = false;
      renderFlashCard();
    }

    /* ---------------- 4. 配對遊戲 ---------------- */
    let selectedMatchCard = null;
    function startMatchGame() {
      const grid = document.getElementById("matchGrid");
      grid.innerHTML = "";
      if (words.length === 0) return;
      const sample = [...words].sort(() => 0.5 - Math.random()).slice(0, 4);
      let items = [];
      sample.forEach(w => {
        items.push({ key: w.word, text: w.word, type: 'jp' });
        items.push({ key: w.word, text: w.meaning, type: 'zh' });
      });
      items.sort(() => 0.5 - Math.random());
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'match-card';
        div.innerText = item.text;
        div.dataset.key = item.key;
        div.onclick = () => handleMatchClick(div);
        grid.appendChild(div);
      });
    }

    function handleMatchClick(card) {
      if (card.classList.contains('matched')) return;
      if (!selectedMatchCard) {
        selectedMatchCard = card;
        card.classList.add('selected');
      } else if (selectedMatchCard === card) {
        selectedMatchCard.classList.remove('selected');
        selectedMatchCard = null;
      } else {
        if (selectedMatchCard.dataset.key === card.dataset.key) {
          selectedMatchCard.classList.add('matched');
          card.classList.add('matched');
          selectedMatchCard = null;
        } else {
          card.classList.add('selected');
          setTimeout(() => {
            selectedMatchCard.classList.remove('selected');
            card.classList.remove('selected');
            selectedMatchCard = null;
          }, 500);
        }
      }
    }

    init();
  </script>
</body>
</html>
